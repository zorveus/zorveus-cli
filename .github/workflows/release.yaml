name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run checks
        run: |
          go test -race ./...
          go vet ./...
          python3 scripts/test_installer.py

      - name: Build the release bundle
        run: sh scripts/package-release.sh "$RELEASE_VERSION"

      - name: Verify the packaged checksums
        run: |
          cd "dist/release-$RELEASE_VERSION/cli/$RELEASE_VERSION"
          sha256sum --check SHA256SUMS

      - name: Save the website bundle as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zorveus-${{ github.ref_name }}-site
          path: dist/release-${{ github.ref_name }}/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          bundle="dist/release-$RELEASE_VERSION"
          binaries="$bundle/cli/$RELEASE_VERSION"
          options=(--verify-tag --title "Zorveus $RELEASE_VERSION" --generate-notes)

          # Prereleases must not change what the default installer downloads.
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi

          gh release create "$RELEASE_VERSION" \
            "$bundle/install.sh" \
            "$bundle/cli/latest" \
            "$binaries/SHA256SUMS" \
            "$binaries"/zorveus-* \
            "${options[@]}"
